name: SAST (Semgrep)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Semgrep scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep:1.179.0 \
            semgrep scan \
              --config p/javascript \
              --config p/nodejs \
              --config p/expressjs \
              --metrics=off \
              --sarif \
              --output /src/semgrep.sarif

      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Fail on ERROR severity
        if: hashFiles('semgrep.sarif') != ''
        run: |
          count="$(jq '[.runs[]?.results[]? | select(.level == "error")] | length' semgrep.sarif)"
          echo "ERROR-severity findings: ${count}"
          jq -r '.runs[]?.results[]? | select(.level == "error") | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' semgrep.sarif
          test "${count}" -eq 0
